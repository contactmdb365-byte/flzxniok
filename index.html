<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Flash Generator - Secure Crypto Flash Service</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: #080808;
            color: #ffffff;
            overflow-x: hidden;
            width: 100%;
            min-height: 100vh;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        @keyframes pulse {
            0%, 100% { opacity: 0.4; }
            50% { opacity: 1; }
        }
        @keyframes progress {
            0% { width: 0%; }
            100% { width: 100%; }
        }
        @keyframes bounce-once {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }
        @keyframes shimmer {
            0% { background-position: -200% 0; }
            100% { background-position: 200% 0; }
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .animate-spin { animation: spin 1s linear infinite; }
        .animate-pulse { animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
        .animate-progress { animation: progress 2s ease-in-out infinite; }
        .animate-bounce-once { animation: bounce-once 0.5s ease-in-out; }
        .animate-fadeIn { animation: fadeIn 0.5s ease-out; }

        .bg-mesh {
            background: 
                radial-gradient(circle at 50% -20%, rgba(13, 162, 147, 0.15) 0%, transparent 70%),
                radial-gradient(circle at 100% 100%, rgba(13, 162, 147, 0.05) 0%, transparent 50%),
                radial-gradient(circle at 0% 50%, rgba(13, 162, 147, 0.03) 0%, transparent 40%);
            min-height: 100vh;
            width: 100%;
        }

        .glass {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .glass-hover:hover {
            background: rgba(255, 255, 255, 0.06);
            border-color: rgba(13, 162, 147, 0.3);
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.3);
        }

        .btn-primary {
            cursor: pointer;
            border-radius: 0.75rem;
            padding: 0.875rem 2rem;
            font-weight: 700;
            letter-spacing: 0.025em;
            color: white;
            transition: all 0.3s ease;
            background: linear-gradient(135deg, #0da293 0%, #0a7a6f 100%);
            border: none;
            box-shadow: 0 4px 15px rgba(13, 162, 147, 0.3);
            width: 100%;
            text-align: center;
            font-size: 1rem;
            position: relative;
            overflow: hidden;
        }
        .btn-primary::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.1), transparent);
            transition: left 0.5s;
        }
        .btn-primary:hover:not(:disabled)::before {
            left: 100%;
        }
        .btn-primary:hover:not(:disabled) {
            filter: brightness(1.1);
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(13, 162, 147, 0.5);
        }
        .btn-primary:active:not(:disabled) {
            transform: translateY(0);
            box-shadow: 0 2px 10px rgba(13, 162, 147, 0.3);
        }
        .btn-primary:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            box-shadow: none;
        }

        .btn-back {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.625rem 1.25rem;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 0.75rem;
            color: rgba(255, 255, 255, 0.7);
            cursor: pointer;
            font-size: 0.875rem;
            font-weight: 600;
            transition: all 0.3s ease;
            text-decoration: none;
            backdrop-filter: blur(10px);
        }
        .btn-back:hover {
            background: rgba(255, 255, 255, 0.12);
            border-color: rgba(255, 255, 255, 0.2);
            color: white;
            transform: translateX(-2px);
        }

        .btn-support {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.625rem 1.25rem;
            background: rgba(13, 162, 147, 0.1);
            border: 1px solid rgba(13, 162, 147, 0.25);
            border-radius: 0.75rem;
            color: #0da293;
            cursor: pointer;
            font-size: 0.875rem;
            font-weight: 700;
            transition: all 0.3s ease;
            text-decoration: none;
            white-space: nowrap;
            backdrop-filter: blur(10px);
        }
        .btn-support:hover {
            background: rgba(13, 162, 147, 0.2);
            border-color: rgba(13, 162, 147, 0.4);
            transform: translateY(-1px);
            box-shadow: 0 4px 15px rgba(13, 162, 147, 0.2);
        }

        .badge-ok { background: rgba(16, 185, 129, 0.12); color: #10b981; border: 1px solid rgba(16, 185, 129, 0.2); }
        .badge-warning { background: rgba(245, 158, 11, 0.12); color: #f59e0b; border: 1px solid rgba(245, 158, 11, 0.2); }
        .badge-processing { background: rgba(234, 179, 8, 0.12); color: #eab308; border: 1px solid rgba(234, 179, 8, 0.2); }
        .badge-deployed { background: rgba(59, 130, 246, 0.12); color: #3b82f6; border: 1px solid rgba(59, 130, 246, 0.2); }
        .badge-success { background: rgba(34, 197, 94, 0.12); color: #22c55e; border: 1px solid rgba(34, 197, 94, 0.2); }
        .badge-error { background: rgba(239, 68, 68, 0.12); color: #ef4444; border: 1px solid rgba(239, 68, 68, 0.2); }

        input, textarea, select {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 0.75rem;

        #aprilFoolModal {

        /* Coin card styles */
        .coin-card {
            background: rgba(255, 255, 255, 0.03);

            border-radius: 1rem;
            padding: 1.25rem;

        /* Network card styles */
        .network-card {
            background: rgba(255, 255, 255, 0.02);

        .network-card.selected {
            background: rgba(13, 162, 147, 0.08);
            border-color: #0da293;
            box-shadow: 0 0 20px rgba(13, 162, 147, 0.15);

        /* QR Code styling */
        .qr-container {
            background: white;
            padding: 1rem;
            border-radius: 1rem;
            display: inline-block;
            max-width: 100%;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);

        .qr-code {
            width: 180px;
            height: 180px;
            max-width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: white;
            border-radius: 0.5rem;
        }
        .qr-code canvas {
            width: 100% !important;
            height: 100% !important;
        }
        
        /* Navigation styles */
        .navbar {
            background: rgba(8, 8, 8, 0.8);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .navbar-inner {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
            padding: 1rem 0;
            flex-wrap: wrap;
        }

        .brand {
            display: flex;

            gap: 0.625rem;
            flex-shrink: 0;
        }

        .brand-dot {
            width: 0.5rem;

            background: #10b981;

        .brand-text {
            font-weight: 800;
            font-size: 1.25rem;

        }

        .nav-actions {
            display: flex;

            gap: 0.75rem;

            justify-content: flex-end;
            min-width: 0;
        }

        .search-wrapper {
            position: relative;
            flex: 1;
            max-width: 320px;
            min-width: 150px;
        }

        .search-input {
            width: 100%;
            padding: 0.625rem 2.75rem 0.625rem 1rem;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 0.75rem;
            color: white;
            font-size: 0.875rem;
            transition: all 0.3s ease;
        }
        .search-input:focus {
            border-color: rgba(13, 162, 147, 0.4);
            background: rgba(13, 162, 147, 0.05);
            box-shadow: 0 0 0 3px rgba(13, 162, 147, 0.1);
        }
        .search-input::placeholder {
            color: rgba(255, 255, 255, 0.3);
        }

        .search-btn {
            position: absolute;
            right: 0.5rem;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(13, 162, 147, 0.2);
            border: none;
            color: #0da293;
            cursor: pointer;
            font-size: 1rem;
            width: 2rem;
            height: 2rem;
            border-radius: 0.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
        }
        .search-btn:hover {
            background: rgba(13, 162, 147, 0.3);
        }

        /* Container */
        .container {
            width: 100%;
            max-width: 1280px;
            margin-left: auto;
            margin-right: auto;
            padding-left: 1.25rem;
            padding-right: 1.25rem;
        }

        /* Section title */

            display: flex;
            align-items: center;
            gap: 0.75rem;
            margin-bottom: 2rem;
        }
        .section-title-line {
            flex: 1;
            height: 1px;
            background: rgba(255, 255, 255, 0.08);
        }
        
        /* Feature card */
        .feature-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.06);

            padding: 2rem 1.5rem;
            text-align: center;
            transition: all 0.3s ease;
        }
        .feature-card:hover {
            background: rgba(255, 255, 255, 0.05);

            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.3);

        .feature-icon {
            width: 3.5rem;

            background: rgba(13, 162, 147, 0.15);

    <div id="app"></div>

    <!-- April Fool's Modal -->
    <div id="aprilFoolModal">

                <div class="text-6xl sm:text-8xl animate-bounce-once">🎭</div>
                <h3 class="text-2xl sm:text-3xl font-black italic text-primary uppercase tracking-tighter">April Fool!</h3>
                <p class="text-white/80 text-base sm:text-lg leading-relaxed">Hey <span id="aprilFoolUsername" class="text-primary font-bold">bro</span>! 🎉</p>
                <div class="bg-white/5 rounded-2xl p-4 border border-white/10">

                                        </div>
                                        <div class="border-t border-white/10 mt-3 pt-3 flex justify-between font-bold">
                                            <span class="text-white/60">Total to Send</span>
                                            <span id="totalAmount" class="text-white">${minAmount} ${network?.payable_currency || 'USDT'}</span>
                                        </div>
                                    </div>
                                    
                                    <!-- Minimum Warning -->
                                    <div class="bg-yellow-500/5 border border-yellow-500/15 rounded-xl p-3.5 text-center">
                                        <p class="text-yellow-400/80 text-sm font-medium">⚠️ Minimum deposit: <span class="font-bold">${minAmount} ${network?.payable_currency || 'USDT'}</span></p>
                                    </div>
                                    
                                    <button onclick="window.app.createOrder()" class="btn-primary py-3.5 text-base">
                                        Proceed to Deposit →
                                    </button>
                                </div>
                            </div>
                        </div>
                    `;
                    
                    setTimeout(() => {
                        const sendInput = document.getElementById('sendAmount');
                        if (sendInput) {
                            sendInput.addEventListener('input', function(e) {
                                let val = parseFloat(e.target.value) || 0;
                                if (val < minAmount) val = minAmount;
                                const receive = (val * multiplier).toFixed(2);
                                const receiveEl = document.getElementById('receiveAmount');
                                const totalEl = document.getElementById('totalAmount');
                                if (receiveEl) receiveEl.innerText = receive;
                                if (totalEl) totalEl.innerText = val + ' ' + (network?.payable_currency || 'USDT');
                            });
                        }
                    }, 0);
                }
                else if (state.step === 'deposit') {
                    const network = state.selectedNetwork;
                    const networkName = network?.name || 'TRC20';
                    const walletAddress = getWalletAddressForNetwork(network);
                    
                    app.innerHTML = `
                        <div class="min-h-screen bg-mesh">
                            <div class="container py-6 sm:py-8 max-w-4xl">
                                <div class="flex items-center justify-between mb-6 sm:mb-8">
                                    <button onclick="window.app.goBack()" class="btn-back">
                                        <span>←</span> Back
                                    </button>
                                    <h2 class="text-xl sm:text-2xl font-black">Deposit</h2>
                                    <div class="w-20 sm:w-24"></div>
                                </div>
                                <div class="grid grid-cols-1 lg:grid-cols-2 gap-4 sm:gap-6">
                                    <!-- QR Code -->
                                    <div class="glass rounded-2xl p-5 sm:p-6 text-center flex flex-col items-center justify-center">
                                        <p class="text-white/40 text-xs sm:text-sm mb-4">Scan QR Code</p>
                                        <div class="qr-container mx-auto">
                                            <div id="qrcode" class="qr-code"></div>
                                        </div>
                                        <p class="text-white/30 text-xs mt-4">Scan with your wallet app</p>
                                    </div>
                                    
                                    <!-- Deposit Details -->
                                    <div class="glass rounded-2xl p-5 sm:p-6 space-y-4">
                                        <div class="text-center mb-2">
                                            <div class="inline-flex items-center gap-2 bg-primary/10 px-3 py-1.5 rounded-full text-primary text-xs font-bold">
                                                ${state.selectedCoin?.icon} ${state.selectedCoin?.symbol} • ${networkName}
                                            </div>
                                        </div>
                                        <div>
                                            <div class="text-white/40 text-xs sm:text-sm mb-1">Network</div>
                                            <div class="font-bold text-base sm:text-lg flex items-center gap-2">
                                                <span>🔗</span> ${networkName}
                                            </div>
                                        </div>
                                        <div>
                                            <div class="text-white/40 text-xs sm:text-sm mb-1">Deposit Address</div>
                                            <div class="bg-black/40 rounded-xl p-3 font-mono text-xs sm:text-sm break-all border border-white/5 select-all">${walletAddress}</div>
                                            <button onclick="window.app.copyAddress('${walletAddress}')" class="text-primary text-sm mt-2 hover:underline bg-transparent border-none cursor-pointer inline-flex items-center gap-1">
                                                📋 Copy Address
                                            </button>
                                        </div>
                                        <div class="grid grid-cols-2 gap-3">
                                            <div class="bg-white/5 rounded-xl p-3">
                                                <div class="text-white/40 text-xs mb-1">Amount to Send</div>
                                                <div class="font-bold text-lg sm:text-xl text-primary">${state.depositAmount}</div>
                                                <div class="text-white/30 text-xs">${network?.payable_currency || 'USDT'}</div>
                                            </div>
                                            <div class="bg-white/5 rounded-xl p-3">
                                                <div class="text-white/40 text-xs mb-1">You Receive</div>
                                                <div class="font-bold text-lg sm:text-xl" style="color: #14f195;">${state.flashAmount}</div>
                                                <div class="text-white/30 text-xs">FLASH ${state.selectedCoin?.symbol}</div>
                                            </div>
                                        </div>
                                        <div class="bg-yellow-500/5 border border-yellow-500/15 rounded-xl p-3">
                                            <p class="text-yellow-400/80 text-sm font-medium">⚠️ Send exactly <span class="font-bold">${state.depositAmount} ${network?.payable_currency || 'USDT'}</span> to the address above</p>
                                        </div>
                                        <button onclick="window.app.verifyDeposit()" class="btn-primary py-3 text-base">
                                            ✓ I Have Sent the Payment
                                        </button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    `;
                    
                    setTimeout(() => {
                        generateQRCode(walletAddress, 'qrcode');
                    }, 100);
                }
                else if (state.step === 'verify') {
                    app.innerHTML = `
                        <div class="min-h-screen bg-mesh">
                            <div class="container py-6 sm:py-8 max-w-2xl">
                                <div class="flex items-center justify-between mb-6 sm:mb-8">
                                    <button onclick="window.app.goBack()" class="btn-back">
                                        <span>←</span> Back
                                    </button>
                                    <h2 class="text-xl sm:text-2xl font-black">Verify Transaction</h2>
                                    <div class="w-20 sm:w-24"></div>
                                </div>
                                <div class="glass rounded-2xl p-5 sm:p-6 space-y-5 sm:space-y-6 animate-fadeIn">
                                    <div>
                                        <label class="block text-sm font-semibold text-white/60 mb-2">Transaction ID / Hash <span class="text-red-400">*</span></label>
                                        <input type="text" id="txid" placeholder="Enter your transaction ID" class="w-full bg-white/5 border border-white/10 rounded-xl p-3.5 text-white font-mono text-xs sm:text-sm focus:border-primary/50">
                                        <p class="text-xs text-white/30 mt-2">Paste the transaction hash from your wallet</p>
                                    </div>
                                    <div class="bg-white/5 rounded-xl p-4 border border-white/5">
                                        <div class="flex justify-between text-sm mb-2">
                                            <span class="text-white/40">Order ID</span>
                                            <span class="font-mono text-primary">#${state.currentOrder?.id || 'Pending'}</span>
                                        </div>
                                        <div class="flex justify-between text-sm">
                                            <span class="text-white/40">Amount Sent</span>
                                            <span class="font-medium">${state.depositAmount} ${state.selectedNetwork?.payable_currency || 'USDT'}</span>
                                        </div>
                                    </div>
                                    <button onclick="window.app.submitVerification()" class="btn-primary py-3.5 text-base">
                                        Verify Transaction →
                                    </button>
                                </div>
                            </div>
                        </div>
                    `;
                }
                else if (state.step === 'order-status') {
                    const order = state.currentOrder;
                    const statuses = [
                        { key: 'submitted', label: 'Order Submitted', icon: '📝', color: '#0da293' },
                        { key: 'under_review', label: 'Under Review', icon: '🔍', color: '#f59e0b' },
                        { key: 'processing', label: 'Processing', icon: '⚙️', color: '#eab308' },
                        { key: 'deployed', label: 'Deployed', icon: '🚀', color: '#3b82f6' },
                        { key: 'successful', label: 'Successful', icon: '✅', color: '#22c55e' }
                    ];
                    const currentIndex = statuses.findIndex(s => s.key === order?.status);
                    
                    app.innerHTML = `
                        <div class="min-h-screen bg-mesh">
                            <div class="container py-6 sm:py-8 max-w-2xl">
                                <div class="flex items-center justify-between mb-6 sm:mb-8">
                                    <button onclick="window.app.goHome()" class="btn-back">
                                        <span>←</span> Home
                                    </button>
                                    <h2 class="text-xl sm:text-2xl font-black">Order Status</h2>
                                    <div class="w-20 sm:w-24"></div>
                                </div>
                                <div class="glass rounded-2xl p-5 sm:p-6 animate-fadeIn">
                                    <div class="text-center mb-6">
                                        <div class="text-5xl sm:text-6xl mb-3">${statuses[currentIndex]?.icon || '📝'}</div>
                                        <div class="font-bold text-lg sm:text-xl">${statuses[currentIndex]?.label || 'Processing'}</div>
                                        <div class="text-white/40 text-sm mt-1">Order #${order?.id}</div>
                                    </div>
                                    <div class="space-y-3 sm:space-y-4">
                                        ${statuses.map((status, idx) => `
                                            <div class="flex items-center gap-3 ${idx > currentIndex ? 'opacity-30' : ''}">
                                                <div class="w-9 h-9 rounded-full flex items-center justify-center text-sm flex-shrink-0 transition" style="background: ${idx <= currentIndex ? status.color + '20' : 'rgba(255,255,255,0.03)'}; border: 2px solid ${idx <= currentIndex ? status.color : 'rgba(255,255,255,0.08)'}">
                                                    ${idx < currentIndex ? '✓' : (idx === currentIndex ? '●' : status.icon)}
                                                </div>
                                                <div class="min-w-0">
                                                    <div class="font-medium text-sm sm:text-base">${status.label}</div>
                                                    <div class="text-white/30 text-xs">${idx === currentIndex ? 'In progress...' : (idx < currentIndex ? 'Completed' : 'Pending')}</div>
                                                </div>
                                            </div>
                                        `).join('')}
                                    </div>
                                    <div class="border-t border-white/10 mt-6 pt-6 space-y-2.5">
                                        <div class="flex justify-between text-sm"><span class="text-white/40">Coin</span><span class="font-medium">${order?.coin?.icon} ${order?.coin?.symbol || 'USDT'}</span></div>
                                        <div class="flex justify-between text-sm"><span class="text-white/40">Network</span><span class="font-medium">${order?.network?.name || 'TRC20'}</span></div>
                                        <div class="flex justify-between text-sm"><span class="text-white/40">Amount</span><span class="font-medium" style="color: #14f195;">${order?.flash_amount} FLASH</span></div>
                                        <div class="flex justify-between text-sm"><span class="text-white/40">Wallet</span><span class="font-mono text-xs truncate max-w-[140px] sm:max-w-[180px]">${order?.wallet_address || '—'}</span></div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    `;
                }
                else if (state.step === 'order-history') {
                    app.innerHTML = `
                        <div class="min-h-screen bg-mesh">
                            <div class="container py-6 sm:py-8 max-w-4xl">
                                <div class="flex items-center justify-between mb-6 sm:mb-8">
                                    <button onclick="window.app.goHome()" class="btn-back">
                                        <span>←</span> Home
                                    </button>
                                    <h2 class="text-xl sm:text-2xl font-black">Order History</h2>
                                    <div class="w-20 sm:w-24"></div>
                                </div>
                                ${state.searchResults.length === 0 ? `
                                    <div class="glass rounded-2xl p-8 sm:p-12 text-center">
                                        <div class="text-5xl sm:text-6xl mb-4">📭</div>
                                        <p class="text-white/50 text-lg mb-2">No orders found</p>
                                        <p class="text-white/30 text-sm">Search by Telegram username, wallet address, or transaction ID</p>
                                    </div>
                                ` : `
                                    <div class="space-y-3">
                                        ${state.searchResults.map(order => `
                                            <div onclick="window.app.viewOrder(${order.id})" class="glass glass-hover rounded-2xl p-4 sm:p-5 cursor-pointer transition">
                                                <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3">
                                                    <div class="min-w-0">
                                                        <div class="flex items-center gap-2 mb-1">
                                                            <span class="font-mono text-primary text-sm font-bold">#${order.id}</span>
                                                            <span class="text-white/30 text-xs">${new Date(order.created_at).toLocaleDateString()}</span>
                                                        </div>
                                                        <div class="font-bold text-base">${order.flash_amount} FLASH ${order.coin?.symbol}</div>
                                                        <div class="text-white/40 text-xs mt-1 font-mono truncate max-w-[250px]">${order.wallet_address}</div>
                                                    </div>
                                                    <div class="text-left sm:text-right w-full sm:w-auto flex-shrink-0 flex sm:block items-center justify-between sm:justify-end gap-2">
                                                        <span class="badge-${order.status === 'successful' ? 'success' : (order.status === 'processing' ? 'processing' : 'ok')} px-3 py-1 rounded-full text-xs font-bold uppercase inline-block">${order.status}</span>
                                                        <span class="text-white/30 text-xs">${order.network?.name}</span>
                                                    </div>
                                                </div>
                                            </div>
                                        `).join('')}
                                    </div>
                                `}
                            </div>
                        </div>
                    `;
                }
            }
            
            // Global functions
            window.app = {
                start: () => { state.step = 'choose-coin'; render(); },
                goHome: () => { state.step = 'home'; state.selectedCoin = null; state.selectedNetwork = null; state.currentOrder = null; render(); },
                goBack: () => {
                    if (state.step === 'choose-network') state.step = 'choose-coin';
                    else if (state.step === 'address') state.step = 'choose-network';
                    else if (state.step === 'amount') state.step = 'address';
                    else if (state.step === 'deposit') state.step = 'amount';
                    else if (state.step === 'verify') state.step = 'deposit';
                    render();
                },
                selectCoin: (id) => { state.selectedCoin = COINS.find(c => c.id === id); state.selectedNetwork = null; render(); },
                selectNetwork: (id) => { state.selectedNetwork = getNetworkById(id); render(); },
                nextToNetwork: () => { if (state.selectedCoin) { state.step = 'choose-network'; render(); } },
                nextToAddress: () => { if (state.selectedNetwork) { state.step = 'address'; render(); } },
                nextToAmount: () => {
                    const address = document.getElementById('walletAddr')?.value;
                    const telegram = document.getElementById('telegramUser')?.value;
                    if (address && telegram) {
                        state.walletAddress = address;
                        state.telegramUsername = telegram;
                        state.step = 'amount';
                        render();
                    } else { showToast('Please fill in all fields', 'error'); }
                },
                createOrder: () => {
                    const sendAmount = parseFloat(document.getElementById('sendAmount')?.value);
                    const network = state.selectedNetwork;
                    const multiplier = network?.multiplier || 100;
                    if (sendAmount && sendAmount >= (network?.min_amount || 0)) {
                        state.depositAmount = sendAmount;
                        state.flashAmount = (sendAmount * multiplier).toFixed(2);
                        const orderData = { deposit_amount: sendAmount, flash_amount: state.flashAmount };
                        state.currentOrder = createOrder(orderData);
                        state.step = 'deposit';
                        render();
                    } else { showToast(`Minimum amount is ${network?.min_amount} ${network?.payable_currency}`, 'error'); }
                },
                copyAddress: (address) => { 
                    navigator.clipboard.writeText(address).then(() => {
                        showToast('Address copied!', 'success');
                    }).catch(() => {
                        showToast('Failed to copy', 'error');
                    });
                },
                verifyDeposit: () => { showAprilFoolModal(); },
                submitVerification: () => {
                    const txid = document.getElementById('txid')?.value;
                    if (txid && state.currentOrder) {
                        showLoading('Verifying transaction on blockchain...');
                        setTimeout(() => {
                            state.currentOrder.status = 'processing';
                            state.currentOrder.txid = txid;
                            hideLoading();
                            state.step = 'order-status';
                            render();
                            showToast('Transaction verified! Order is being processed.', 'success');
                        }, 3000);
                    } else { showToast('Please enter transaction ID', 'error'); }
                },
                searchOrders: () => {
                    const query = document.getElementById('searchInput')?.value;
                    if (query) { 
                        state.searchResults = searchOrders(query); 
                        state.step = 'order-history'; 
                        render(); 
                    }
                },
                viewOrder: (id) => {
                    const order = state.orders.find(o => o.id === id);
                    if (order) { 
                        state.currentOrder = order; 
                        state.selectedCoin = order.coin; 
                        state.selectedNetwork = order.network; 
                        state.step = 'order-status'; 
                        render(); 
                    }
                }
            };
            
            window.closeAprilFoolModal = function() {
                const modal = document.getElementById('aprilFoolModal');
                if (modal) modal.style.display = 'none';
                state.step = 'verify';
                render();
            };
            
            // Handle Enter key in search
            document.addEventListener('keypress', function(e) {
                if (e.key === 'Enter' && document.activeElement?.id === 'searchInput') {
                    window.app.searchOrders();
                }
            });
            
            render();
        })();
    </script>
</body>
</html>
